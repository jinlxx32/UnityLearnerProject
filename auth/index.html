<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication | freshgrad.site</title>
    <link rel="stylesheet" href="../css/auth-common.css">
    <!-- Supabase JS v2 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Supabase Client Helper -->
    <script src="../js/supabase-client.js"></script>
</head>
<body>

    <!-- Header Navigation -->
    <header class="app-header">
        <div class="nav-container">
            <a href="/" class="brand-logo">
                <span>freshgrad.site</span>
            </a>
            <ul class="nav-links">
                <li><a href="/">Home</a></li>
                <li><a href="/auth/" class="active">Login / Sign Up</a></li>
                <li><a href="/dashboard/">Dashboard</a></li>
                <li><a href="/settings/">Settings</a></li>
            </ul>
        </div>
    </header>

    <!-- Main Auth Form Container -->
    <main class="page-wrapper">
        <div class="glass-card">
            
            <div class="auth-header">
                <h2 id="auth-title">Welcome Back</h2>
                <p id="auth-subtitle">Sign in to access your dashboard and settings</p>
            </div>

            <!-- Tab Switcher -->
            <div class="tab-switcher">
                <button type="button" class="tab-btn active" id="tab-login" onclick="switchTab('login')">Log In</button>
                <button type="button" class="tab-btn" id="tab-signup" onclick="switchTab('signup')">Sign Up</button>
            </div>

            <!-- Alert Box for Notifications -->
            <div id="alert-box" class="alert-box hidden">
                <span id="alert-msg"></span>
            </div>

            <!-- Form -->
            <form id="auth-form" onsubmit="handleAuthSubmit(event)">
                <!-- Full Name Field (Shown only on Sign Up) -->
                <div class="form-group hidden" id="group-fullname">
                    <label for="fullname">Full Name</label>
                    <input type="text" id="fullname" class="form-control" placeholder="Jane Doe" autocomplete="name">
                </div>

                <!-- Email Field -->
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="user@example.com" required autocomplete="email">
                </div>

                <!-- Password Field -->
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-container">
                        <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
                        <button type="button" class="toggle-pwd" onclick="togglePasswordVisibility()">Show</button>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn-primary" id="btn-submit">
                    <span id="btn-text">Log In</span>
                    <div class="spinner hidden" id="btn-spinner"></div>
                </button>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer class="app-footer">
        <p>&copy; 2026 freshgrad.site. All rights reserved.</p>
    </footer>

    <!-- Logic Script -->
    <script>
        let currentMode = 'login'; // 'login' or 'signup'

        // Check if user is already logged in -> redirect to dashboard
        document.addEventListener('DOMContentLoaded', async () => {
            if (window.AuthService) {
                await AuthService.requireGuest();
            }
        });

        function switchTab(mode) {
            currentMode = mode;
            hideAlert();

            const tabLogin = document.getElementById('tab-login');
            const tabSignup = document.getElementById('tab-signup');
            const title = document.getElementById('auth-title');
            const subtitle = document.getElementById('auth-subtitle');
            const fullnameGroup = document.getElementById('group-fullname');
            const btnText = document.getElementById('btn-text');

            if (mode === 'login') {
                tabLogin.classList.add('active');
                tabSignup.classList.remove('active');
                title.textContent = 'Welcome Back';
                subtitle.textContent = 'Sign in to access your dashboard and settings';
                fullnameGroup.classList.add('hidden');
                btnText.textContent = 'Log In';
            } else {
                tabSignup.classList.add('active');
                tabLogin.classList.remove('active');
                title.textContent = 'Create an Account';
                subtitle.textContent = 'Get instant access to protected dashboard features';
                fullnameGroup.classList.remove('hidden');
                btnText.textContent = 'Create Account';
            }
        }

        function togglePasswordVisibility() {
            const pwdInput = document.getElementById('password');
            const toggleBtn = document.querySelector('.toggle-pwd');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                toggleBtn.textContent = 'Hide';
            } else {
                pwdInput.type = 'password';
                toggleBtn.textContent = 'Show';
            }
        }

        function showAlert(message, type = 'error') {
            const box = document.getElementById('alert-box');
            const msg = document.getElementById('alert-msg');
            box.className = `alert-box ${type}`;
            msg.textContent = message;
        }

        function hideAlert() {
            const box = document.getElementById('alert-box');
            box.className = 'alert-box hidden';
        }

        function setLoading(isLoading) {
            const btn = document.getElementById('btn-submit');
            const btnText = document.getElementById('btn-text');
            const spinner = document.getElementById('btn-spinner');

            btn.disabled = isLoading;
            if (isLoading) {
                btnText.classList.add('hidden');
                spinner.classList.remove('hidden');
            } else {
                btnText.classList.remove('hidden');
                spinner.classList.add('hidden');
            }
        }

        async function handleAuthSubmit(event) {
            event.preventDefault();
            hideAlert();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const fullname = document.getElementById('fullname').value;

            if (!email || !password) {
                showAlert('Please fill in all required fields.', 'error');
                return;
            }

            if (password.length < 6) {
                showAlert('Password must be at least 6 characters long.', 'error');
                return;
            }

            setLoading(true);

            try {
                let result;
                if (currentMode === 'login') {
                    result = await AuthService.signIn(email, password);
                } else {
                    result = await AuthService.signUp(email, password, fullname);
                }

                if (result.success) {
                    if (result.session) {
                        showAlert('Success! Redirecting to dashboard...', 'success');
                        setTimeout(() => {
                            window.location.href = '/dashboard/';
                        }, 800);
                    } else {
                        // In case email verification is still active in Supabase dashboard
                        showAlert('Account created! Please check your email or disable Email Confirmation in Supabase.', 'warning');
                        setLoading(false);
                    }
                } else {
                    showAlert(result.error || 'Authentication failed. Please check your credentials.', 'error');
                    setLoading(false);
                }
            } catch (err) {
                console.error(err);
                showAlert('An unexpected network error occurred.', 'error');
                setLoading(false);
            }
        }
    </script>
</body>
</html>
